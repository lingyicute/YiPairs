<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbf8ff">
<title>YiPairs Web · 翻牌配对</title>
<style>
  :root {
    --h: 295;
    --font: "Nebulove", "Yomi-UI-Emoji", "Google Sans", system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    --ease: cubic-bezier(.2, 0, 0, 1);
    --ease-spring: cubic-bezier(.3, 1.4, .5, 1);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --primary: oklch(.45 .16 var(--h));
    --on-primary: oklch(1 0 0);
    --primary-container: oklch(.91 .06 var(--h));
    --on-primary-container: oklch(.25 .1 var(--h));
    --secondary-container: oklch(.91 .03 var(--h));
    --on-secondary-container: oklch(.28 .04 var(--h));
    --tertiary-container: oklch(.9 .07 calc(var(--h) + 70));
    --on-tertiary-container: oklch(.28 .08 calc(var(--h) + 70));
    --surface: oklch(.985 .005 var(--h));
    --surface-container: oklch(.945 .012 var(--h));
    --surface-container-high: oklch(.92 .016 var(--h));
    --surface-container-highest: oklch(.89 .02 var(--h));
    --on-surface: oklch(.2 .02 var(--h));
    --on-surface-variant: oklch(.45 .025 var(--h));
    --outline: oklch(.58 .025 var(--h));
    --outline-variant: oklch(.8 .02 var(--h));
    --card-face: oklch(.99 .004 var(--h));
    --scrim: rgba(20, 16, 30, .4);
    --shadow: 0 6px 24px rgba(40, 30, 70, .14);
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --primary: oklch(.8 .12 var(--h));
    --on-primary: oklch(.3 .1 var(--h));
    --primary-container: oklch(.38 .12 var(--h));
    --on-primary-container: oklch(.92 .05 var(--h));
    --secondary-container: oklch(.36 .04 var(--h));
    --on-secondary-container: oklch(.9 .03 var(--h));
    --tertiary-container: oklch(.4 .09 calc(var(--h) + 70));
    --on-tertiary-container: oklch(.92 .06 calc(var(--h) + 70));
    --surface: oklch(.17 .012 var(--h));
    --surface-container: oklch(.22 .015 var(--h));
    --surface-container-high: oklch(.26 .017 var(--h));
    --surface-container-highest: oklch(.3 .02 var(--h));
    --on-surface: oklch(.92 .01 var(--h));
    --on-surface-variant: oklch(.8 .02 var(--h));
    --outline: oklch(.65 .02 var(--h));
    --outline-variant: oklch(.4 .02 var(--h));
    --card-face: oklch(.34 .025 var(--h));
    --scrim: rgba(0, 0, 0, .55);
    --shadow: 0 6px 24px rgba(0, 0, 0, .5);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    min-height: 100dvh;
    font-family: var(--font);
    color: var(--on-surface);
    background-color: var(--surface);
    background-image:
      radial-gradient(90% 45% at 95% 12%, color-mix(in oklch, var(--primary-container) 75%, transparent), transparent 70%),
      radial-gradient(70% 40% at 0% 60%, color-mix(in oklch, var(--secondary-container) 55%, transparent), transparent 70%);
    background-attachment: fixed;
    transition: background-color .3s, color .3s;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  button { font-family: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
  svg { display: block; fill: currentColor; }

  /* ---------- App bar ---------- */
  header {
    position: relative;
    z-index: 20;
    background: var(--surface);
    transition: background-color .3s;
  }
  .wrap { width: 100%; max-width: 640px; margin: 0 auto; padding: 0 20px; }
  .bar { display: flex; align-items: center; gap: 12px; height: 80px; }
  .logo {
    width: 48px; height: 48px; border-radius: 16px; flex: none;
    background: var(--primary); color: var(--on-primary);
    display: grid; place-items: center;
  }
  .logo .g { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; width: 26px; height: 26px; }
  .logo .g i { border-radius: 6px; background: currentColor; }
  .logo .g i:nth-child(2), .logo .g i:nth-child(3) { opacity: .55; }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
  .brand b { font-size: 24px; font-weight: 700; letter-spacing: -.3px; white-space: nowrap; }
  .badge {
    background: var(--primary-container); color: var(--on-primary-container);
    font-size: 13px; font-weight: 600; padding: 3px 12px; border-radius: 999px;
  }
  .icon-btn {
    width: 48px; height: 48px; border-radius: 50%;
    display: grid; place-items: center; flex: none;
    color: var(--on-surface-variant);
    transition: background-color .2s, color .2s, transform .2s var(--ease);
  }
  .icon-btn:hover { background: color-mix(in oklch, var(--on-surface) 8%, transparent); }
  .icon-btn:active { transform: scale(.92); }
  .icon-btn[aria-expanded="true"] { background: var(--surface-container-high); color: var(--on-surface); }
  .icon-btn svg { width: 26px; height: 26px; }
  .bar .icon-btn { color: var(--on-surface); }
  :focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }

  /* ---------- Popovers ---------- */
  .popover {
    position: fixed; z-index: 50; left: 0; top: 0;
    background: var(--surface-container-high);
    border-radius: 24px; box-shadow: var(--shadow);
    padding: 12px;
    visibility: hidden; opacity: 0; transform: scale(.92); transform-origin: top right;
    transition: opacity .18s, transform .22s var(--ease), visibility 0s .22s;
  }
  .popover.open { visibility: visible; opacity: 1; transform: none; transition-delay: 0s; }
  #palettePop { padding: 18px 18px 20px; width: min(300px, calc(100vw - 24px)); }
  #palettePop h3 { margin: 0 0 14px 4px; font-size: 15px; font-weight: 600; color: var(--on-surface-variant); }
  .swatches { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; justify-items: center; }
  .swatch {
    width: 100%; max-width: 56px; aspect-ratio: 1; border-radius: 50%;
    display: grid; place-items: center; color: #1b1b1b;
    border: 3px solid transparent; transition: transform .2s var(--ease-spring), border-color .2s;
  }
  .swatch:hover { transform: scale(1.06); }
  .swatch svg { width: 24px; height: 24px; opacity: 0; transform: scale(.5); transition: .2s var(--ease-spring); }
  .swatch[aria-checked="true"] { border-color: var(--on-surface); box-shadow: inset 0 0 0 3px var(--surface-container-high); }
  .swatch[aria-checked="true"] svg { opacity: 1; transform: none; }
  #menuPop { width: 220px; }
  .menu-item {
    display: flex; align-items: center; gap: 16px; width: 100%;
    padding: 14px 14px; border-radius: 16px; font-size: 16px; font-weight: 500; text-align: left;
    transition: background-color .2s;
  }
  .menu-item:hover { background: color-mix(in oklch, var(--on-surface) 8%, transparent); }
  .menu-item svg { width: 24px; height: 24px; color: var(--on-surface-variant); }

  /* ---------- Main ---------- */
  main { padding-bottom: 40px; }
  .title { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 14px; padding: 18px 4px 16px; }
  .title h1 { margin: 0; font-size: 44px; line-height: 1.1; font-weight: 800; letter-spacing: -.5px; }
  .title .sub { font-size: 17px; font-weight: 600; color: var(--on-surface-variant); }

  .stats { display: flex; align-items: center; gap: 12px; }
  .stat {
    flex: 1; min-width: 0; border-radius: 28px; padding: 14px 12px 12px; text-align: center;
    transition: background-color .3s, color .3s;
  }
  .stat.a { background: var(--surface-container-highest); color: var(--on-surface); }
  .stat.b { background: var(--primary-container); color: var(--on-primary-container); }
  .stat small { display: block; font-size: 15px; font-weight: 600; letter-spacing: 1px; opacity: .8; }
  .stat output { display: block; font-size: 36px; line-height: 1.15; font-weight: 800; font-variant-numeric: tabular-nums; }
  .round {
    width: 56px; height: 56px; border-radius: 50%; flex: none; display: grid; place-items: center;
    position: relative;
    transition: transform .25s var(--ease), background-color .2s, opacity .2s, box-shadow .2s;
  }
  .peek-badge {
    position: absolute; top: -5px; right: -5px;
    min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px;
    background: var(--primary); color: var(--on-primary);
    font-size: 12px; font-weight: 700; line-height: 20px; text-align: center;
    font-variant-numeric: tabular-nums;
    box-shadow: 0 0 0 2px var(--surface);
    pointer-events: none;
    transition: background-color .2s, color .2s;
  }
  .round:disabled .peek-badge { background: var(--surface-container-highest); color: var(--on-surface-variant); }
  .round svg { width: 28px; height: 28px; transition: transform .5s var(--ease); }
  .round:active { transform: scale(.9); }
  .round.tonal { background: var(--surface-container-high); color: var(--on-surface); }
  .round.filled { background: var(--primary); color: var(--on-primary); }
  .round.filled:hover svg { transform: rotate(180deg); }
  .round:hover { box-shadow: 0 2px 10px rgba(0,0,0,.18); }
  .round:disabled { opacity: .45; pointer-events: none; }

  /* ---------- Board ---------- */
  .board-wrap {
    margin: 22px auto 0;
    width: min(100%, max(300px, min(600px, calc((100dvh - 520px) * var(--cols) / var(--rows)))));
  }
  .board {
    display: grid; grid-template-columns: repeat(var(--cols), 1fr); gap: var(--gap, 8px);
    padding: calc(var(--gap, 8px) + 4px);
    background: var(--surface-container-high);
    border-radius: 28px;
    transition: background-color .3s;
    position: relative;
  }
  .board-veil {
    position: absolute; inset: 0; z-index: 5; border-radius: inherit;
    display: grid; place-items: center;
    background: color-mix(in oklch, var(--surface-container-high) 42%, transparent);
    -webkit-backdrop-filter: blur(12px) saturate(.7); backdrop-filter: blur(12px) saturate(.7);
    transition: opacity .3s, visibility 0s .3s;
  }
  .board-veil.hide { opacity: 0; visibility: hidden; pointer-events: none; }
  .card {
    display: block; width: 100%; aspect-ratio: 1; position: relative;
    container-type: inline-size; perspective: 700px;
    border-radius: 24cqw;
  }
  .card.dealing { animation: deal .5s var(--ease-spring) both; animation-delay: var(--d, 0ms); }
  .inner {
    position: absolute; inset: 0; transform-style: preserve-3d;
    transition: transform .45s var(--ease);
  }
  .card.flipped .inner, .card.matched .inner { transform: rotateY(180deg); }
  .face {
    position: absolute; inset: 0; border-radius: 24cqw; display: grid; place-items: center;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    transition: background-color .3s, box-shadow .3s;
  }
  .face.back {
    background: var(--primary-container); color: var(--on-primary-container);
  }
  .face.back::after {
    content: ""; width: 34%; aspect-ratio: 1; opacity: .38; border-radius: 28%;
    background:
      radial-gradient(circle at 25% 25%, currentColor 0 17%, transparent 18%),
      radial-gradient(circle at 75% 25%, currentColor 0 17%, transparent 18%),
      radial-gradient(circle at 25% 75%, currentColor 0 17%, transparent 18%),
      radial-gradient(circle at 75% 75%, currentColor 0 17%, transparent 18%);
  }
  .card:not(.flipped):not(.matched):hover .face.back { background: color-mix(in oklch, var(--primary-container) 86%, var(--primary)); }
  .card:not(.flipped):not(.matched):active { transform: scale(.94); transition: transform .12s; }
  .face.front {
    transform: rotateY(180deg); background: var(--card-face);
    font-size: 54cqw; line-height: 1;
    font-family: "Yomi-UI-Emoji", "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
    box-shadow: 0 1px 3px rgba(0,0,0,.12);
  }
  .card.matched { transform: scale(.94); animation: pop .55s var(--ease) both; }
  .card.matched .face.front { background: var(--primary); box-shadow: none; }
  .card.wrong { animation: shake .42s var(--ease); }
  .card.wrong .face.front { background: color-mix(in oklch, var(--card-face) 80%, oklch(.7 .15 25)); }
  .card[aria-disabled="true"] { cursor: default; }

  @keyframes deal { from { opacity: 0; transform: scale(.5) translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.1); } 100% { transform: scale(.94); } }
  @keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }

  /* ---------- Chips ---------- */
  .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin: 28px 0 22px; }
  .chip {
    height: 48px; padding: 0 22px; border-radius: 16px; font-size: 17px; font-weight: 700;
    border: 2px solid var(--outline); color: var(--on-surface);
    display: inline-flex; align-items: center; gap: 8px;
    transition: background-color .2s, border-color .2s, padding .25s var(--ease), transform .2s;
  }
  .chip:hover { background: color-mix(in oklch, var(--on-surface) 7%, transparent); }
  .chip:active { transform: scale(.95); }
  .chip svg { width: 0; height: 20px; opacity: 0; transition: width .25s var(--ease), opacity .2s; }
  .chip[aria-checked="true"] {
    background: var(--secondary-container); color: var(--on-secondary-container);
    border-color: transparent; padding: 0 22px 0 16px;
  }
  .chip[aria-checked="true"] svg { width: 20px; opacity: 1; }

  .help { text-align: center; color: var(--on-surface-variant); font-size: 15px; line-height: 2.1; padding: 0 4px; }
  .help p { margin: 0; }
  .help .credit a { color: var(--primary); font-weight: 600; text-decoration: none; }
  .help .credit a:hover { text-decoration: underline; }
  kbd {
    display: inline-block; font-family: inherit; font-size: 13px; line-height: 1.5; min-width: 26px;
    padding: 1px 8px; margin: 0 1px; border-radius: 8px; border: 1.5px solid var(--outline);
    color: var(--on-surface-variant); text-align: center;
  }
  .touch-only { display: none; }
  @media (hover: none) { .touch-only { display: block; } .kb-only { display: none; } }

  /* ---------- Dialog ---------- */
  .scrim {
    position: fixed; inset: 0; z-index: 100; background: var(--scrim);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    display: grid; place-items: center; padding: 24px;
    visibility: hidden; opacity: 0; transition: opacity .25s, visibility 0s .25s;
  }
  .scrim.open { visibility: visible; opacity: 1; transition-delay: 0s; }
  .dialog {
    width: 100%; max-width: 420px; max-height: calc(100dvh - 48px); overflow-y: auto;
    background: var(--surface-container-high); border-radius: 28px; padding: 28px 24px 22px;
    box-shadow: var(--shadow); transform: scale(.88) translateY(20px); transition: transform .3s var(--ease-spring);
  }
  .scrim.open .dialog { transform: none; }
  .d-icon {
    width: 64px; height: 64px; border-radius: 20px; margin: 0 auto 16px;
    background: var(--primary-container); color: var(--on-primary-container); display: grid; place-items: center;
  }
  .d-icon svg { width: 34px; height: 34px; }
  .dialog h2 { margin: 0 0 14px; text-align: center; font-size: 26px; font-weight: 700; }
  .d-body { font-size: 16px; line-height: 1.75; color: var(--on-surface-variant); }
  .d-body p { margin: 0 0 6px; }
  .d-body b { color: var(--on-surface); }
  .d-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 22px; flex-wrap: wrap; }
  .btn {
    height: 48px; padding: 0 26px; border-radius: 999px; font-size: 16px; font-weight: 700;
    transition: transform .2s var(--ease), background-color .2s, box-shadow .2s;
  }
  .btn:active { transform: scale(.95); }
  .btn.filled { background: var(--primary); color: var(--on-primary); }
  .btn.filled:hover { box-shadow: 0 2px 10px rgba(0,0,0,.25); }
  .btn.text { color: var(--primary); }
  .btn.text:hover { background: color-mix(in oklch, var(--primary) 10%, transparent); }
  .result { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 4px 0 6px; }
  .result div { background: var(--surface-container-highest); border-radius: 18px; padding: 12px 6px; text-align: center; }
  .result small { display: block; font-size: 13px; font-weight: 600; opacity: .8; color: var(--on-surface-variant); }
  .result strong { display: block; font-size: 26px; font-weight: 800; color: var(--on-surface); font-variant-numeric: tabular-nums; }
  .newrec { text-align: center; color: var(--primary); font-weight: 700; margin: 10px 0 0; }
  .rec-row {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    background: var(--surface-container-highest); border-radius: 18px; padding: 12px 16px; margin-bottom: 8px;
  }
  .rec-row .n { font-weight: 700; color: var(--on-surface); }
  .rec-row .n span { display: block; font-size: 13px; font-weight: 500; color: var(--on-surface-variant); }
  .rec-row .v { text-align: right; font-size: 14px; line-height: 1.5; font-variant-numeric: tabular-nums; }
  .rec-row .v b { font-size: 16px; }

  /* ---------- Responsive ---------- */
  @media (max-width: 480px) {
    .wrap { padding: 0 16px; }
    .bar { height: 72px; gap: 8px; }
    .brand b { font-size: 21px; }
    .badge { font-size: 12px; padding: 2px 10px; }
    .logo { width: 44px; height: 44px; border-radius: 14px; }
    .title h1 { font-size: 38px; }
    .title .sub { font-size: 15px; }
    .stats { gap: 8px; }
    .stat { border-radius: 24px; padding: 12px 6px 10px; }
    .stat small { font-size: 14px; }
    .stat output { font-size: 30px; }
    .round { width: 48px; height: 48px; }
    .round svg { width: 24px; height: 24px; }
    .board { border-radius: 24px; }
    .chip { padding: 0 16px; height: 44px; font-size: 16px; }
    .chip[aria-checked="true"] { padding: 0 16px 0 12px; }
    .chips { gap: 8px; }
    .help { font-size: 14px; }
  }
  @media (max-width: 340px) { .badge { display: none; } .icon-btn { width: 42px; height: 42px; } }
  @media (min-width: 700px) and (max-width: 999px) { .wrap { max-width: 680px; } .title h1 { font-size: 48px; } }

  /* ---------- Wide / landscape: two-column layout ---------- */
  .layout .title { grid-area: title; }
  .layout .stats { grid-area: stats; }
  .layout .board-wrap { grid-area: board; }
  .layout .chips { grid-area: chips; }
  .layout .help { grid-area: help; }

  @media (min-width: 1000px), (orientation: landscape) and (min-width: 640px) and (max-height: 520px) {
    .wrap { max-width: 1240px; padding: 0 40px; }
    main { padding-bottom: 24px; }
    .layout {
      display: grid;
      grid-template-columns: minmax(300px, 400px) minmax(0, 1fr);
      grid-template-rows: 1fr auto auto auto auto 1fr;
      grid-template-areas: ". board" "title board" "stats board" "chips board" "help board" ". board";
      column-gap: clamp(32px, 5vw, 80px);
      min-height: calc(100dvh - 80px - 24px);
      --chrome: 170px;
    }
    .layout .title { grid-row: 2; padding: 0 0 22px; flex-direction: column; align-items: flex-start; gap: 6px; }
    .layout .title h1 { font-size: 56px; }
    .layout .title .sub { font-size: 17px; }
    .layout .stats { grid-row: 3; }
    .layout .chips {
      grid-row: 4; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 28px 0 24px;
    }
    .layout .chip { justify-content: center; width: 100%; }
    .layout .help { grid-row: 5; text-align: left; padding: 0; }
    .layout .board-wrap {
      grid-row: 1 / -1; align-self: center; justify-self: center; margin: 0;
      width: min(100%, max(300px, calc((100dvh - var(--chrome)) * var(--cols) / var(--rows))));
    }
    .board { border-radius: 36px; }
  }
  @media (min-width: 1500px) {
    .wrap { max-width: 1480px; }
    .layout { grid-template-columns: minmax(340px, 460px) minmax(0, 1fr); }
    .layout .title h1 { font-size: 64px; }
    .layout .stat output { font-size: 42px; }
    .layout .help { font-size: 16px; }
    .layout .board-wrap { width: min(100%, max(300px, calc((100dvh - var(--chrome)) * var(--cols) / var(--rows)))); }
  }
  @media (orientation: landscape) and (min-width: 640px) and (max-height: 520px) and (max-width: 999px) {
    .wrap { padding: 0 24px; }
    .bar { height: 60px; }
    .layout { min-height: calc(100dvh - 60px - 24px); grid-template-columns: minmax(260px, 340px) minmax(0, 1fr); column-gap: 28px; --chrome: 110px; }
    .layout .title h1 { font-size: 36px; }
    .layout .title { padding-bottom: 12px; }
    .layout .title .sub { font-size: 14px; }
    .layout .stat output { font-size: 28px; }
    .layout .stat small { font-size: 13px; }
    .layout .stat { padding: 8px 6px; border-radius: 20px; }
    .layout .round { width: 44px; height: 44px; }
    .layout .chips { margin: 14px 0 10px; gap: 8px; }
    .layout .chip { height: 40px; font-size: 15px; }
    .layout .help { font-size: 13px; line-height: 1.7; }
    .layout .board-wrap { width: min(100%, max(220px, calc((100dvh - var(--chrome)) * var(--cols) / var(--rows)))); }
    .board { border-radius: 24px; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }

  /* ---------- Loading overlay ---------- */
  #loader {
    position: fixed; inset: 0; z-index: 200;
    display: grid; place-items: center;
    background: var(--surface);
    transition: opacity .35s, visibility 0s .35s;
  }
  #loader.hide { opacity: 0; visibility: hidden; }
  .spinner {
    width: 46px; height: 46px; border-radius: 50%;
    border: 4px solid color-mix(in oklch, var(--primary) 25%, transparent);
    border-top-color: var(--primary);
    animation: spin .8s linear infinite;
  }

<header>
  <div class="wrap">
    <div class="bar">
      <div class="logo" aria-hidden="true"><div class="g"><i></i><i></i><i></i><i></i></div></div>
      <div class="brand"><b>YiPairs</b><span class="badge">Web</span></div>
      <button class="icon-btn" id="themeBtn" aria-label="切换深色/浅色模式"><svg id="themeIcon"><use href="#i-moon"/></svg></button>
      <button class="icon-btn" id="paletteBtn" aria-label="选择配色" aria-expanded="false"><svg><use href="#i-palette"/></svg></button>
      <button class="icon-btn" id="menuBtn" aria-label="菜单" aria-expanded="false"><svg><use href="#i-menu"/></svg></button>
    </div>
  </div>
</header>

<div class="popover" id="palettePop" role="dialog" aria-label="选择配色">
  <h3>选择配色</h3>
  <div class="swatches" id="swatches" role="radiogroup"></div>
</div>
<div class="popover" id="menuPop" role="menu">
  <button class="menu-item" role="menuitem" data-act="help"><svg><use href="#i-help"/></svg>玩法说明</button>
  <button class="menu-item" role="menuitem" data-act="records"><svg><use href="#i-trophy"/></svg>最佳成绩</button>
  <button class="menu-item" role="menuitem" data-act="clear"><svg><use href="#i-trash"/></svg>清除记录</button>
</div>

<main>
  <div class="wrap layout">
    <div class="title">
      <h1>翻牌配对</h1>
      <span class="sub" id="subtitle">简单 · 4×3</span>
    </div>

    <div class="stats">
      <div class="stat a"><small>步数</small><output id="moves">0</output></div>
      <div class="stat b"><small>用时</small><output id="time">00:00</output></div>
      <button class="round tonal" id="hintBtn" aria-label="偷看" title="偷看"><svg><use href="#i-bulb"/></svg><span class="peek-badge" id="peekBadge" aria-hidden="true">2</span></button>
      <button class="round filled" id="restartBtn" aria-label="重新开始" title="重新开始"><svg><use href="#i-refresh"/></svg></button>
    </div>

    <div class="board-wrap" id="boardWrap">
      <div class="board" id="board" role="group" aria-label="卡片区域">
        <div class="board-veil" id="boardVeil"><button class="btn filled" id="readyBtn">准备好了</button></div>

    <div class="help">
      <p class="kb-only">点击卡片翻开，或使用 <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> / <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移动</p>
      <p class="kb-only"><kbd>空格</kbd> 翻牌，<kbd>H</kbd> 偷看，<kbd>R</kbd> 重开</p>
      <p class="touch-only">轻点卡片翻开，每次翻开两张</p>
      <p>两张图案相同即配对成功，配对全部卡片即获胜</p>
      <p class="credit">Made with love by <a href="https://github.com/lingyicute" target="_blank" rel="noopener noreferrer">lingyicute</a> ❤️</p>
    </div>

</main>

<div class="scrim" id="scrim" aria-hidden="true">
  <div class="dialog" id="dialog" role="dialog" aria-modal="true">
    <div class="d-icon" id="dIcon"></div>

    <div class="d-body" id="dBody"></div>
    <div class="d-actions" id="dActions"></div>
  </div>

<script>
(() => {
  'use strict';
  const $ = (s, r = document) => r.querySelector(s);
  const icon = (id) => `<svg><use href="#i-${id}"/></svg>`;

  /* ---------- Config ---------- */
  const DIFFS = {
    easy:   { name: '简单', cols: 4, rows: 3 },
    medium: { name: '中等', cols: 4, rows: 4 },
    hard:   { name: '困难', cols: 5, rows: 6 },
    expert: { name: '专家', cols: 6, rows: 6 },
  };
  const PALETTES = [
    { name: '紫色', h: 295 }, { name: '蓝色', h: 255 }, { name: '青色', h: 195 }, { name: '绿色', h: 150 },
    { name: '黄色', h: 95 },  { name: '橙色', h: 55 },  { name: '粉色', h: 350 }, { name: '红色', h: 25 },
  ];
  const SYMBOLS = ['🍎','🍋','🍇','🍓','🍑','🥝','🍒','🍉','🥑','🌽','🥕','🍄','🌸','🐱','🦊','🐼','🐸','🐙','🦄','🐝','🍩','🌵'];
  const PEEK_TIME = 2000;
  const PEEK_LIMIT = 2;
  const MISMATCH_DELAY = 850;

  /* ---------- Storage ---------- */
  const KEY = 'yipairs.web.v1';
  const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; } };
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch {} };
  const store = Object.assign({ mode: null, hue: 0, diff: 'easy', records: {} }, load());

  /* ---------- Theme ---------- */
  const root = document.documentElement;
  const themeMeta = $('meta[name="theme-color"]');
  const mq = window.matchMedia('(prefers-color-scheme: dark)');
  function applyTheme() {
    const mode = store.mode || (mq.matches ? 'dark' : 'light');
    root.dataset.theme = mode;
    root.style.setProperty('--h', PALETTES[store.hue].h);
    $('#themeIcon').innerHTML = `<use href="#i-${mode === 'dark' ? 'sun' : 'moon'}"/>`;
    requestAnimationFrame(() => { themeMeta.content = getComputedStyle(document.body).backgroundColor; });
  }
  $('#themeBtn').onclick = () => {
    store.mode = root.dataset.theme === 'dark' ? 'light' : 'dark';
    save(); applyTheme();
  };
  mq.addEventListener?.('change', () => { if (!store.mode) applyTheme(); });

  const swatchBox = $('#swatches');
  PALETTES.forEach((p, i) => {
    const b = document.createElement('button');
    b.className = 'swatch'; b.setAttribute('role', 'radio'); b.setAttribute('aria-label', p.name);
    b.style.background = `oklch(.68 .14 ${p.h})`;
    b.innerHTML = icon('check');
    b.onclick = () => { store.hue = i; save(); applyTheme(); markSwatches(); };
    swatchBox.appendChild(b);
  });
  function markSwatches() {
    [...swatchBox.children].forEach((b, i) => b.setAttribute('aria-checked', i === store.hue));
  }

  /* ---------- Popovers ---------- */
  const pops = [
    { btn: $('#paletteBtn'), el: $('#palettePop') },
    { btn: $('#menuBtn'), el: $('#menuPop') },
  ];
  function closePops(except) {
    pops.forEach(p => { if (p !== except) { p.el.classList.remove('open'); p.btn.setAttribute('aria-expanded', 'false'); } });
  }
  pops.forEach(p => {
    p.btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const open = !p.el.classList.contains('open');
      closePops(open ? p : null);
      if (open) {
        const r = p.btn.getBoundingClientRect();
        const w = p.el.offsetWidth;
        p.el.style.top = (r.bottom + 6) + 'px';
        p.el.style.left = Math.max(12, Math.min(r.right - w, innerWidth - w - 12)) + 'px';
      }
      p.el.classList.toggle('open', open);
      p.btn.setAttribute('aria-expanded', open);
    });
    p.el.addEventListener('click', e => e.stopPropagation());
  });
  document.addEventListener('click', () => closePops());
  addEventListener('resize', () => closePops());

  /* ---------- Dialog ---------- */
  const scrim = $('#scrim');
  let dialogOpen = false;
  function showDialog({ icon: ic = 'info', title, body, actions }) {
    closePops();
    $('#dIcon').innerHTML = icon(ic);
    $('#dTitle').textContent = title;
    $('#dBody').innerHTML = body;
    const box = $('#dActions'); box.innerHTML = '';
    actions.forEach(a => {
      const b = document.createElement('button');
      b.className = 'btn ' + (a.primary ? 'filled' : 'text');
      b.textContent = a.label;
      b.onclick = () => { closeDialog(); a.onClick?.(); };
      box.appendChild(b);
    });
    dialogOpen = true; pause();
    scrim.classList.add('open'); scrim.setAttribute('aria-hidden', 'false');
    setTimeout(() => box.lastChild?.focus({ preventScroll: true }), 50);
  }
  function closeDialog() {
    dialogOpen = false;
    scrim.classList.remove('open'); scrim.setAttribute('aria-hidden', 'true');
    resume();
  }
  scrim.addEventListener('click', (e) => { if (e.target === scrim) closeDialog(); });

  /* ---------- Records ---------- */
  const fmt = (ms) => {
    const s = Math.floor(ms / 1000);
    return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
  };
  function showHelp() {
    showDialog({
      icon: 'info', title: '玩法说明',
      body: `<p>点击卡片将其翻开，<b>每次翻开两张</b>。</p>
             <p>两张图案相同即<b>配对成功</b>并保持翻开；不同则会自动翻回去。</p>
             <p>记住每张卡片的位置，用尽量少的步数和时间配对所有卡片。</p>
             <p><b>偷看</b>会暂停计时并展示全部卡片 2 秒，每局仅限手动偷看 2 次；每局开始点击「准备好了」时会免费预览一次。</p>
             <p>最少步数与最短用时分别记录，并按难度保存。</p>`,
      actions: [{ label: '知道了', primary: true }],
    });
  }
  function showRecords() {
    const rows = Object.entries(DIFFS).map(([k, d]) => {
      const r = store.records[k];
      return `<div class="rec-row"><div class="n">${d.name}<span>${d.cols}×${d.rows}</span></div>
        <div class="v">${r ? `最少步数 <b>${r.moves}</b><br>最短用时 <b>${fmt(r.time)}</b>` : '<span style="opacity:.6">暂无记录</span>'}</div></div>`;
    }).join('');
    showDialog({ icon: 'trophy', title: '最佳成绩', body: rows, actions: [{ label: '关闭', primary: true }] });
  }
  function confirmClear() {
    showDialog({
      icon: 'trash', title: '清除记录', body: '<p style="text-align:center">确定要清除所有难度的最佳成绩吗？此操作无法撤销。</p>',
      actions: [
        { label: '取消' },
        { label: '清除', primary: true, onClick: () => { store.records = {}; save(); } },
      ],
    });
  }
  $('#menuPop').addEventListener('click', (e) => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    const a = b.dataset.act;
    if (a === 'help') showHelp(); else if (a === 'records') showRecords(); else confirmClear();
  });

  /* ---------- Game state ---------- */
  const boardEl = $('#board'), wrapEl = $('#boardWrap');
  const veilEl = $('#boardVeil'), readyBtn = $('#readyBtn');
  let diff = DIFFS[store.diff] ? store.diff : 'easy';
  let deck = [], cards = [];
  let first = -1, locked = false, pendingWrong = null, wrongTimer = 0;
  let moves = 0, matched = 0, peeks = 0;
  let started = false, over = false;
  let phase = 'ready'; // ready → preview → playing → over
  let peeksLeft = PEEK_LIMIT, peekTimer = 0;
  let acc = 0, lastTs = null, tickId = 0;

  const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };

  function tick() {
    if (lastTs !== null) { const n = performance.now(); acc += n - lastTs; lastTs = n; }
    $('#time').textContent = fmt(acc);
  }
  function pause() { if (lastTs !== null) { tick(); lastTs = null; } }
  function resume() { if (started && !over && !dialogOpen && !document.hidden && lastTs === null) lastTs = performance.now(); }
  document.addEventListener('visibilitychange', () => document.hidden ? pause() : resume());

  function buildChips() {
    const box = $('#chips'); box.innerHTML = '';
    Object.entries(DIFFS).forEach(([k, d]) => {
      const b = document.createElement('button');
      b.className = 'chip'; b.setAttribute('role', 'radio');
      b.setAttribute('aria-checked', k === diff);
      b.innerHTML = `${icon('check')}<span>${d.name}</span>`;
      b.title = `${d.cols}×${d.rows}`;
      b.onclick = () => { if (k === diff) return; diff = k; store.diff = k; save(); newGame(); };
      box.appendChild(b);
    });
  }
  function markChips() {
    [...$('#chips').children].forEach((b, i) => b.setAttribute('aria-checked', Object.keys(DIFFS)[i] === diff));
  }

  function newGame() {
    clearTimeout(wrongTimer); clearTimeout(peekTimer); clearInterval(tickId);
    const d = DIFFS[diff];
    const pairs = d.cols * d.rows / 2;
    const syms = shuffle(SYMBOLS.slice()).slice(0, pairs);
    deck = shuffle([...syms, ...syms]);
    first = -1; locked = false; pendingWrong = null;
    moves = 0; matched = 0; peeks = 0; started = false; over = false; acc = 0; lastTs = null;
    phase = 'ready'; peeksLeft = PEEK_LIMIT;

    wrapEl.style.setProperty('--cols', d.cols);
    wrapEl.style.setProperty('--rows', d.rows);
    boardEl.style.setProperty('--gap', d.cols >= 6 ? '6px' : '8px');
    boardEl.innerHTML = '';
    cards = deck.map((sym, i) => {
      const c = document.createElement('button');
      c.className = 'card dealing';
      c.style.setProperty('--d', (i * 22) + 'ms');
      c.dataset.i = i;
      c.setAttribute('aria-label', `第 ${i + 1} 张卡片，未翻开`);
      c.innerHTML = `<span class="inner"><span class="face back"></span><span class="face front" aria-hidden="true">${sym}</span></span>`;
      c.onclick = () => flip(i);
      boardEl.appendChild(c);
      return c;
    });
    boardEl.appendChild(veilEl);
    veilEl.classList.remove('hide');
    setTimeout(() => cards.forEach(c => c.classList.remove('dealing')), deck.length * 22 + 600);

    markChips();
    updatePeekBtn();
    updateHUD();
    tickId = setInterval(tick, 250);
  }

  function updateHUD() {
    const d = DIFFS[diff];
    $('#subtitle').textContent = `${d.name} · ${d.cols}×${d.rows} · 已配对 ${matched}/${deck.length / 2}`;
    $('#moves').textContent = moves;
    $('#time').textContent = fmt(acc);
  }

  function flushWrong() {
    if (!pendingWrong) return;
    clearTimeout(wrongTimer);
    const [a, b] = pendingWrong; pendingWrong = null;
    [a, b].forEach(i => { cards[i].classList.remove('flipped', 'wrong'); cards[i].setAttribute('aria-label', `第 ${i + 1} 张卡片，未翻开`); });
    locked = false;
  }

  function flip(i) {
    if (phase !== 'playing' || dialogOpen) return;
    if (pendingWrong) flushWrong();
    const c = cards[i];
    if (locked || c.classList.contains('flipped') || c.classList.contains('matched')) return;
    c.classList.add('flipped');
    c.setAttribute('aria-label', `第 ${i + 1} 张卡片：${deck[i]}`);
    if (first < 0) { first = i; return; }

    const a = first; first = -1; moves++;
    if (deck[a] === deck[i]) {
      locked = true;
      setTimeout(() => {
        [a, i].forEach(k => { cards[k].classList.add('matched'); cards[k].classList.remove('flipped'); cards[k].setAttribute('aria-disabled', 'true'); });
        matched++; locked = false; updateHUD();
        if (matched === deck.length / 2) win();
      }, 420);
    } else {
      locked = true; pendingWrong = [a, i];
      setTimeout(() => { if (pendingWrong) pendingWrong.forEach(k => cards[k].classList.add('wrong')); }, 450);
      wrongTimer = setTimeout(flushWrong, MISMATCH_DELAY + 300);
    }
    updateHUD();
  }

  /* 展示全部未配对的卡片 2 秒后翻回；cb 在展示结束后调用 */
  function showAll(cb) {
    if (pendingWrong) {
      clearTimeout(wrongTimer);
      const [a, b] = pendingWrong; pendingWrong = null;
      [a, b].forEach(i => cards[i].classList.remove('flipped', 'wrong'));
    }
    first = -1;
    locked = true;
    const shown = [];
    cards.forEach((c, i) => {
      if (!c.classList.contains('matched')) { c.classList.add('flipped'); shown.push(i); }
    });
    peekTimer = setTimeout(() => {
      shown.forEach(i => cards[i].classList.remove('flipped'));
      locked = false;
      cb?.();
    }, PEEK_TIME);
  }

  function updatePeekBtn() {
    const b = $('#hintBtn');
    const usable = phase === 'playing' && !over && peeksLeft > 0;
    b.disabled = !usable;
    const label = peeksLeft > 0 ? `偷看（剩余 ${peeksLeft} 次）` : '偷看次数已用完';
    b.title = label;
    b.setAttribute('aria-label', label);
    $('#peekBadge').textContent = peeksLeft;
  }

  function peek() {
    if (phase !== 'playing' || over || dialogOpen || peeksLeft <= 0) return;
    peeksLeft--; peeks++;
    updatePeekBtn();
    pause();
    showAll(resume);
  }

  readyBtn.onclick = () => {
    if (phase !== 'ready') return;
    phase = 'preview';
    veilEl.classList.add('hide');
    showAll(() => {
      phase = 'playing';
      started = true;
      lastTs = document.hidden ? null : performance.now();
      updatePeekBtn();
    });
  };

  function win() {
    over = true; phase = 'over'; pause(); tick();
    updatePeekBtn();
    const prev = store.records[diff];
    const rec = { moves, time: Math.round(acc) };
    let newMoves = !prev || moves < prev.moves, newTime = !prev || rec.time < prev.time;
    store.records[diff] = { moves: Math.min(moves, prev ? prev.moves : Infinity), time: Math.min(rec.time, prev ? prev.time : Infinity) };
    save();
    const d = DIFFS[diff];
    setTimeout(() => {
      showDialog({
        icon: 'trophy', title: '配对完成!',
        body: `<div class="result">
                 <div><small>步数</small><strong>${moves}</strong></div>
                 <div><small>用时</small><strong>${fmt(acc)}</strong></div>
                 <div><small>偷看</small><strong>${peeks}</strong></div>
               </div>
               <p style="text-align:center;margin-top:8px">${d.name} · ${d.cols}×${d.rows}</p>
               ${(newMoves || newTime) ? `<p class="newrec">🎉 ${[newMoves && '最少步数', newTime && '最短用时'].filter(Boolean).join('、')}新纪录!</p>` : ''}`,
        actions: [{ label: '关闭' }, { label: '再来一局', primary: true, onClick: newGame }],
      });
    }, 700);
  }

  $('#restartBtn').onclick = newGame;
  $('#hintBtn').onclick = peek;

  /* ---------- Keyboard ---------- */
  document.addEventListener('keydown', (e) => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === 'Escape') { if (dialogOpen) closeDialog(); closePops(); return; }
    if (dialogOpen) return;
    const k = e.key.toLowerCase();
    const cols = DIFFS[diff].cols, n = deck.length;
    const dir = { arrowup: -cols, w: -cols, arrowdown: cols, s: cols, arrowleft: -1, a: -1, arrowright: 1, d: 1 }[k];
    if (dir !== undefined) {
      e.preventDefault();
      const cur = cards.indexOf(document.activeElement);
      if (cur < 0) { cards[0].focus(); return; }
      let next = cur + dir;
      if (Math.abs(dir) === 1) { if (Math.floor(next / cols) !== Math.floor(cur / cols)) return; }
      else if (next < 0 || next >= n) return;
      cards[next].focus();
    } else if (k === 'r' && !e.repeat) { newGame(); }
    else if (k === 'h' && !e.repeat) { peek(); }
    else if (k === ' ' && document.activeElement?.classList.contains('card')) { /* native button click handles it */ }
  });

  /* ---------- Loading overlay ---------- */
  const loaderEl = $('#loader');
  const delay = (ms) => new Promise(r => setTimeout(r, ms));
  const whenLoaded = () => document.readyState === 'complete'
    ? Promise.resolve()
    : new Promise(res => window.addEventListener('load', res, { once: true }));
  const withTimeout = (p, ms) => Promise.race([p, delay(ms)]);
  Promise.all([
    withTimeout(whenLoaded(), 6000),
    withTimeout(document.fonts?.ready ?? Promise.resolve(), 6000).catch(() => {}),
    delay(350), // 至少显示片刻，避免一闪而过
  ]).then(() => loaderEl.classList.add('hide'));

  /* ---------- Init ---------- */
  applyTheme(); markSwatches(); buildChips(); newGame();
})();
</script>
</body>
</html>
